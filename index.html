<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="2c6z.png">
  <title>2CZAI | AI Infrastructure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section -->
  <header class="hero">
    <h1 class="hero-title">2CZAI</h1>
    <p class="hero-tagline">2C6Z.xyz AI INSTRUCTURE For your Machine.</p>

    <!-- Copyable Endpoint Widget -->
    <div class="endpoint-box" id="endpointBox" onclick="copyEndpoint()">
      <span class="endpoint-text">api.2c6z.xyz</span>
      <span class="copy-hint" id="copyHint">Click to copy</span>
    </div>
  </header>
  
  <script>
    function copyEndpoint() {
      const endpoint = "api.2c6z.xyz";
      navigator.clipboard.writeText(endpoint);
      const hint = document.getElementById("copyHint");
      hint.innerText = "Copied!";
      setTimeout(() => {
        hint.innerText = "Click to copy";
      }, 2000);
    }
  </script>

</body>
</html>
